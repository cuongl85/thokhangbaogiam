<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thọ Khang Bảo Giám — Hành Trình Nhân Quả</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    --paper: #EDE4D2;
    --paper-2: #E4D8C0;
    --ink: #2A241C;
    --ink-soft: #55493A;
    --seal: #8C2F2A;
    --seal-dark: #6E211D;
    --jade: #3F6155;
    --gold: #A9803F;
    --rule: rgba(42,36,28,0.18);
    --card: #F6F0E2;
    --shadow: rgba(42,36,28,0.22);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --paper: #1D1912;
      --paper-2: #241F17;
      --ink: #EDE3D0;
      --ink-soft: #C8BBA3;
      --seal: #D9756A;
      --seal-dark: #C25F55;
      --jade: #7FAE9B;
      --gold: #D6AD6E;
      --rule: rgba(237,227,208,0.18);
      --card: #241E15;
      --shadow: rgba(0,0,0,0.5);
    }
  }
  :root[data-theme="dark"] {
    --paper: #1D1912;
    --paper-2: #241F17;
    --ink: #EDE3D0;
    --ink-soft: #C8BBA3;
    --seal: #D9756A;
    --seal-dark: #C25F55;
    --jade: #7FAE9B;
    --gold: #D6AD6E;
    --rule: rgba(237,227,208,0.18);
    --card: #241E15;
    --shadow: rgba(0,0,0,0.5);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body {
    height: 100%;
    margin: 0;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--paper);
    background-image:
      radial-gradient(ellipse at 20% 10%, rgba(169,128,63,0.08), transparent 55%),
      radial-gradient(ellipse at 85% 90%, rgba(63,97,85,0.07), transparent 55%);
    color: var(--ink);
    font-family: 'Noto Serif', 'Times New Roman', serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100%;
    display: flex;
    justify-content: center;
    overflow-x: hidden;
  }
  .stage {
    width: 100%;
    max-width: 640px;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    position: relative;
  }
  header.top {
    padding: 22px 22px 14px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    border-bottom: 1px solid var(--rule);
  }
  header.top .brand {
    font-family: 'Ma Shan Zheng', 'Noto Serif', serif;
    font-size: 26px;
    color: var(--seal);
    letter-spacing: 0.5px;
  }
  header.top .phuc {
    font-size: 14px;
    color: var(--ink-soft);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  header.top .phuc b {
    color: var(--jade);
    font-size: 17px;
    font-weight: 700;
  }
  main {
    flex: 1;
    padding: 26px 22px 40px;
    display: flex;
    flex-direction: column;
  }
  /* ---------- INTRO ---------- */
  .intro {
    text-align: center;
    padding-top: 8px;
  }
  .intro .glyph {
    font-family: 'Ma Shan Zheng', serif;
    font-size: 64px;
    color: var(--seal);
    line-height: 1;
    margin-bottom: 6px;
  }
  .intro h1 {
    font-size: 27px;
    line-height: 1.3;
    margin: 6px 0 4px;
    font-weight: 700;
  }
  .intro .sub {
    color: var(--ink-soft);
    font-size: 15px;
    font-style: italic;
    margin-bottom: 22px;
  }
  .intro p.lead {
    text-align: left;
    line-height: 1.75;
    font-size: 16px;
    color: var(--ink);
    max-width: 52ch;
    margin: 0 auto 26px;
  }
  .rule {
    border: none;
    border-top: 1px solid var(--rule);
    margin: 22px 0;
    width: 100%;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: var(--seal);
    color: #F6EEDF;
    border: none;
    padding: 14px 26px;
    font-family: 'Noto Serif', serif;
    font-size: 16px;
    font-weight: 600;
    border-radius: 3px;
    cursor: pointer;
    box-shadow: 0 3px 0 var(--seal-dark);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
    letter-spacing: 0.3px;
  }
  .btn:active {
    transform: translateY(2px);
    box-shadow: 0 1px 0 var(--seal-dark);
  }
  .btn.secondary {
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--rule);
    box-shadow: none;
  }
  .btn.secondary:active { transform: translateY(1px); }
  .btn.block { width: 100%; }
  .btn:focus-visible, .choice:focus-visible, .chapter-card:focus-visible {
    outline: 2px solid var(--jade);
    outline-offset: 2px;
  }

  /* ---------- MAP / CHAPTER LIST ---------- */
  .map-title {
    font-size: 20px;
    font-weight: 700;
    margin: 0 0 4px;
  }
  .map-sub {
    color: var(--ink-soft);
    font-size: 14px;
    margin: 0 0 20px;
  }
  .chapters {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .chapter-card {
    background: var(--card);
    border: 1px solid var(--rule);
    border-left: 4px solid var(--gold);
    border-radius: 2px;
    padding: 16px 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    cursor: pointer;
    text-align: left;
    font-family: inherit;
    color: var(--ink);
    box-shadow: 0 2px 6px var(--shadow);
  }
  .chapter-card.done { border-left-color: var(--jade); opacity: 0.88; }
  .chapter-card .num {
    font-family: 'Ma Shan Zheng', serif;
    font-size: 30px;
    color: var(--seal);
    min-width: 38px;
    text-align: center;
    flex-shrink: 0;
  }
  .chapter-card .info h3 {
    margin: 0 0 4px;
    font-size: 16.5px;
    font-weight: 700;
  }
  .chapter-card .info p {
    margin: 0;
    font-size: 13.5px;
    color: var(--ink-soft);
    line-height: 1.4;
  }
  .chapter-card .status {
    margin-left: auto;
    font-size: 12px;
    color: var(--jade);
    flex-shrink: 0;
    white-space: nowrap;
  }

  /* ---------- STORY ---------- */
  .story-tag {
    font-size: 12.5px;
    color: var(--gold);
    text-transform: none;
    letter-spacing: 0.4px;
    margin-bottom: 6px;
  }
  .story-title {
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 16px;
    line-height: 1.35;
  }
  .story-text {
    font-size: 16.5px;
    line-height: 1.85;
    color: var(--ink);
    margin-bottom: 26px;
    white-space: pre-line;
  }
  .story-text.result {
    font-style: italic;
    color: var(--ink-soft);
  }
  .choices {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 8px;
  }
  .choice {
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 2px;
    padding: 14px 16px;
    font-family: inherit;
    font-size: 15.5px;
    line-height: 1.5;
    color: var(--ink);
    text-align: left;
    cursor: pointer;
    display: flex;
    gap: 12px;
  }
  .choice .mark {
    color: var(--seal);
    font-weight: 700;
    flex-shrink: 0;
  }
  .choice:active { background: var(--paper-2); }

  .result-banner {
    display: inline-block;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.4px;
    padding: 5px 12px;
    border-radius: 2px;
    margin-bottom: 14px;
  }
  .result-banner.good { background: rgba(63,97,85,0.14); color: var(--jade); }
  .result-banner.bad { background: rgba(140,47,42,0.14); color: var(--seal); }
  .result-banner.mixed { background: rgba(169,128,63,0.16); color: var(--gold); }

  .karma-delta {
    font-size: 14px;
    color: var(--ink-soft);
    margin-bottom: 22px;
  }
  .karma-delta b { color: var(--jade); }
  .karma-delta b.neg { color: var(--seal); }

  .actions {
    margin-top: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding-top: 10px;
  }

  /* ---------- ENDING ---------- */
  .ending .glyph {
    font-family: 'Ma Shan Zheng', serif;
    font-size: 54px;
    color: var(--seal);
    text-align: center;
    margin-bottom: 4px;
  }
  .ending h2 {
    text-align: center;
    font-size: 23px;
    margin: 0 0 6px;
  }
  .ending .score {
    text-align: center;
    color: var(--ink-soft);
    font-size: 14px;
    margin-bottom: 22px;
  }
  .ending p {
    line-height: 1.8;
    font-size: 16px;
    margin-bottom: 18px;
  }
  .journal {
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 2px;
    padding: 14px 16px;
    margin-bottom: 22px;
  }
  .journal h4 {
    margin: 0 0 10px;
    font-size: 13px;
    color: var(--ink-soft);
    font-weight: 600;
  }
  .journal-row {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    font-size: 14px;
    padding: 6px 0;
    border-bottom: 1px solid var(--rule);
  }
  .journal-row:last-child { border-bottom: none; }
  .journal-row span:first-child { color: var(--ink); flex: 1; }
  .journal-row span:last-child { color: var(--jade); font-weight: 600; white-space: nowrap; }
  .journal-row span:last-child.neg { color: var(--seal); }

  footer.note {
    text-align: center;
    font-size: 12px;
    color: var(--ink-soft);
    padding: 4px 22px 18px;
    line-height: 1.6;
  }

  .hidden { display: none !important; }

  /* ---------- ILLUSTRATIONS ---------- */
  .art-frame {
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 6px 18px var(--shadow);
    margin-bottom: 20px;
    background: #0d1320;
  }
  .art-frame.hero { margin-bottom: 18px; }
  .scene-art {
    display: block;
    width: 100%;
    height: auto;
  }
  .chapter-card { align-items: stretch; }
  .chapter-card .thumb {
    width: 78px;
    height: 78px;
    border-radius: 5px;
    overflow: hidden;
    flex-shrink: 0;
    position: relative;
    box-shadow: 0 2px 6px var(--shadow);
  }
  .chapter-card .thumb svg { width: 100%; height: 100%; display: block; }
  .chapter-card .thumb .num-badge {
    position: absolute;
    left: 4px;
    bottom: 4px;
    background: rgba(20,16,10,0.62);
    color: #F6EEDF;
    font-family: 'Ma Shan Zheng', serif;
    font-size: 15px;
    line-height: 1;
    padding: 3px 6px 4px;
    border-radius: 3px;
  }
</style>
</head>

  <main id="main">

</div>

    alt: "Danh tiếng thầy đồ", sky: ["#BFE0DE","#DCEDD0","#F1F2CF"],
    glow: { x: 200, y: 70, r: 110, color: "#FFFAE0" }, hillBack: "#8DAE8C", hillFront: "#5D7E5C",
    extra: houseSil(320, 300, 160, 88, "#3A2C1E", "#4C3C26")
  });
  CH_ART.hoimon = svgScene({
    alt: "Của hồi môn và lòng tham", sky: ["#4A2334","#8A4358","#D97C6A"],
    glow: { x: 470, y: 80, r: 110, color: "#FFD6C2" }, hillBack: "#5E3040", hillFront: "#3C1E2A",
    extra: houseSil(320, 300, 150, 84, "#4A2E2E", "#5E3E3E")
  });
  CH_ART.tuongco = svgScene({
    alt: "Pho tượng cổ trong miếu hoang", sky: ["#22331F","#3E5738","#6E8A5E"],
    glow: { x: 320, y: 90, r: 130, color: "#E6EFC8" }, hillBack: "#2C3F27", hillFront: "#1B2818",
    extra: treeSil(140, 300, 46, 28, "#33472F") + houseSil(320, 300, 90, 60, "#2E3B2E", "#3C4A3C") + treeSil(510, 300, 52, 32, "#2C3D29")
  });
  CH_ART.hangxomganhghet = svgScene({
    alt: "Hàng xóm ganh ghét", sky: ["#3A2536","#7A4550","#C9713F"],
    glow: { x: 470, y: 90, r: 110, color: "#FFCB9A" }, hillBack: "#573A3E", hillFront: "#382428",
    extra: houseSil(210, 300, 90, 68, "#3A2A22", "#4A372B") + houseSil(430, 300, 90, 68, "#3A2A22", "#4A372B")
  });
  CH_ART.baocuoithu = svgScene({
    alt: "Cơn bão cuối mùa thu", sky: ["#151E2A","#1F303C","#2A4450"],
    glow: { x: 460, y: 55, r: 55, color: "#C9DEE2" }, hillBack: "#132129", hillFront: "#0B141A", rain: true,
    extra: waterBand(264) + houseSil(150, 300, 90, 60, "#241A12", "#33261A") + boatSil(430, 254, 140)
  });

  // ---- Intro: moon-gate garden path ----
  var ART_INTRO = svgScene({
    alt: "Cổng trăng dẫn vào hành trình",
    sky: ["#2C3A4A", "#5A7268", "#B7C48A"],
    glow: { x: 320, y: 150, r: 120, color: "#F6EAC8" },
    hillBack: "#3E5346",
    hillFront: "#28382F",
    extra:
      '<circle cx="320" cy="185" r="95" fill="#182219"/>' +
      '<circle cx="320" cy="185" r="86" fill="#3E5346"/>' +
      '<path d="M240,300 Q320,250 400,300 Z" fill="#182219"/>'
  });

  // ---- Endings ----
  var ART_END_GOOD = svgScene({
    alt: "Phước dày thọ trường",
    sky: ["#F6E7B0", "#F3C878", "#E79A5C"],
    glow: { x: 480, y: 70, r: 130, color: "#FFF3CF" },
    hillBack: "#7C9A5E",
    hillFront: "#4E7048",
    extra:
      '<line x1="140" y1="300" x2="140" y2="190" stroke="#3A2A18" stroke-width="6"/>' +
      '<circle cx="140" cy="168" r="34" fill="#E8879A"/>' +
      '<circle cx="112" cy="182" r="24" fill="#EFA1AF"/>' +
      '<circle cx="168" cy="182" r="24" fill="#EFA1AF"/>' +
      birdV(380, 90, 1) + birdV(420, 70, 0.8) + birdV(450, 100, 0.7)
  });
  var ART_END_MID = svgScene({
    alt: "An khang bình ổn",
    sky: ["#CDE3E8", "#A9CBD6", "#8FB6C4"],
    glow: { x: 480, y: 80, r: 100, color: "#FFFAEA" },
    hillBack: "#6E8F82",
    hillFront: "#43604F",
    extra:
      '<line x1="470" y1="300" x2="470" y2="205" stroke="#3A2A18" stroke-width="6"/>' +
      '<circle cx="470" cy="182" r="38" fill="#5E7C56"/>'
  });
  var ART_END_MIXED = svgScene({
    alt: "Đường đời trồi sụt",
    sky: ["#2A3550", "#5C5F72", "#C9905C"],
    glow: { x: 170, y: 70, r: 90, color: "#E9E4CE" },
    hillBack: "#41485C",
    hillFront: "#2A2E3E",
    stars: true,
    extra:
      '<circle cx="500" cy="70" r="46" fill="#F3B15C" opacity="0.9"/>'
  });
  var ART_END_BAD = svgScene({
    alt: "Họa đến từ tâm buông thả",
    sky: ["#161A22", "#232A38", "#33261F"],
    glow: { x: 460, y: 60, r: 60, color: "#9AA6B2" },
    hillBack: "#12151C",
    hillFront: "#0B0D12",
    rain: true,
    extra:
      '<path d="M180,300 L188,210 L170,205 L192,150 L178,148 L204,95" stroke="#0B0D12" stroke-width="6" fill="none" stroke-linecap="round"/>' +
      '<path d="M192,150 L220,130" stroke="#0B0D12" stroke-width="5" fill="none" stroke-linecap="round"/>' +
      birdV(300, 60, 0.7) + birdV(330, 78, 0.6)
  });

  var STORAGE_KEY = "tkbg_progress_v1";

  // ---------------- STATE ----------------
  var state = {
    phuc: 0,
    completed: {}, // id -> {choiceIndex, delta}
    screen: "intro", // intro | map | story | result | ending
    activeChapter: null,
    activeResult: null
  };

  function loadProgress() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (parsed && typeof parsed.phuc === "number" && parsed.completed) {
          state.phuc = parsed.phuc;
          state.completed = parsed.completed;
        }
      }
    } catch (e) { /* ignore, start fresh */ }
  }

  function saveProgress() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        phuc: state.phuc,
        completed: state.completed
      }));
    } catch (e) { /* storage unavailable, continue without saving */ }
  }

  function resetProgress() {
    state.phuc = 0;
    state.completed = {};
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
  }

  // ---------------- RENDER HELPERS ----------------
  var main = document.getElementById("main");
  var phucValueEl = document.getElementById("phucValue");
  var globalNote = document.getElementById("globalNote");

  function updatePhucDisplay() {
    phucValueEl.textContent = state.phuc;
  }

  function el(tag, cls, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html !== undefined) e.innerHTML = html;
    return e;
  }

  function clearMain() {
    main.innerHTML = "";
  }

  // ---------------- SCREENS ----------------
  function renderIntro() {
    clearMain();
    globalNote.classList.remove("hidden");
    var wrap = el("div", "intro");
    wrap.appendChild(el("div", "art-frame hero", ART_INTRO));
    wrap.appendChild(el("div", "glyph", "壽康"));
    wrap.appendChild(el("h1", "", "Thọ Khang Bảo Giám"));
    wrap.appendChild(el("div", "sub", "Hành Trình Nhân Quả"));
    wrap.appendChild(el("p", "lead",
      "Tựa sách xưa vẫn răn dạy: giữ được nết na trong lòng thì phúc dày, buông thả theo dục vọng nhất thời thì họa đến không hay. Hai mươi sáu câu chuyện dưới đây, dựa theo tinh thần các sách khuyến thiện cổ, đặt bạn vào ngã rẽ của những con người bình thường. Mỗi lựa chọn của bạn sẽ gieo một hạt giống — thiện hay bất thiện — và Phước Đức sẽ ghi lại điều đó."
    ));
    var btn = el("button", "btn block", "Bắt Đầu Hành Trình");
    btn.addEventListener("click", function(){
      state.screen = "map";
      render();
    });
    wrap.appendChild(btn);

    if (Object.keys(state.completed).length > 0) {
      var cont = el("button", "btn secondary block", "Tiếp Tục Từ Trước");
      cont.style.marginTop = "10px";
      cont.addEventListener("click", function(){
        state.screen = "map";
        render();
      });
      wrap.appendChild(cont);
    }
    main.appendChild(wrap);
  }

  function renderMap() {
    clearMain();
    globalNote.classList.remove("hidden");
    var wrap = el("div", "");
    wrap.appendChild(el("div", "map-title", "Hai Mươi Sáu Ngã Rẽ Cuộc Đời"));
    wrap.appendChild(el("div", "map-sub", "Chọn một câu chuyện để bước vào."));

    var list = el("div", "chapters");
    CHAPTERS.forEach(function(ch, idx){
      var done = state.completed[ch.id];
      var card = el("button", "chapter-card" + (done ? " done" : ""));
      card.setAttribute("type", "button");
      var thumb = el("div", "thumb", CH_ART[ch.artKey]);
      thumb.appendChild(el("div", "num-badge", String(idx + 1).padStart(2, "0")));
      var info = el("div", "info");
      info.appendChild(el("h3", "", ch.title));
      info.appendChild(el("p", "", ch.tag));
      card.appendChild(thumb);
      card.appendChild(info);
      if (done) {
        var deltaTxt = (done.delta >= 0 ? "+" : "") + done.delta;
        card.appendChild(el("div", "status", "Đã qua · " + deltaTxt));
      } else {
        card.appendChild(el("div", "status", "Chưa mở"));
      }
      card.addEventListener("click", function(){
        state.activeChapter = ch;
        state.screen = "story";
        render();
      });
      list.appendChild(card);
    });
    wrap.appendChild(list);

    if (Object.keys(state.completed).length === CHAPTERS.length) {
      var hr = el("hr", "rule");
      wrap.appendChild(hr);
      var endBtn = el("button", "btn block", "Xem Kết Cục Cuộc Đời");
      endBtn.addEventListener("click", function(){
        state.screen = "ending";
        render();
      });
      wrap.appendChild(endBtn);
    }

    main.appendChild(wrap);
  }

  function renderStory() {
    clearMain();
    globalNote.classList.add("hidden");
    var ch = state.activeChapter;
    var wrap = el("div", "");
    wrap.appendChild(el("div", "art-frame", CH_ART[ch.artKey]));
    wrap.appendChild(el("div", "story-tag", ch.tag));
    wrap.appendChild(el("div", "story-title", ch.title));
    wrap.appendChild(el("div", "story-text", ch.intro));

    var choicesWrap = el("div", "choices");
    ch.choices.forEach(function(choice, i){
      var b = el("button", "choice");
      b.setAttribute("type", "button");
      var mark = el("span", "mark", String.fromCharCode(65 + i));
      var txt = el("span", "", choice.text);
      b.appendChild(mark);
      b.appendChild(txt);
      b.addEventListener("click", function(){
        state.phuc += choice.delta;
        state.completed[ch.id] = { choiceIndex: i, delta: choice.delta };
        saveProgress();
        updatePhucDisplay();
        state.activeResult = choice;
        state.screen = "result";
        render();
      });
      choicesWrap.appendChild(b);
    });
    wrap.appendChild(choicesWrap);
    main.appendChild(wrap);
  }

  function renderResult() {
    clearMain();
    globalNote.classList.add("hidden");
    var ch = state.activeChapter;
    var res = state.activeResult;
    var wrap = el("div", "");
    wrap.appendChild(el("div", "art-frame", CH_ART[ch.artKey]));
    wrap.appendChild(el("div", "story-tag", ch.tag));

    var bannerText = res.tone === "good" ? "Thiện Nghiệp" : (res.tone === "bad" ? "Bất Thiện Nghiệp" : "Nghiệp Xen Lẫn");
    wrap.appendChild(el("div", "result-banner " + res.tone, bannerText));

    wrap.appendChild(el("div", "story-title", ch.title));
    wrap.appendChild(el("div", "story-text result", res.result));

    var deltaClass = res.delta < 0 ? "neg" : "";
    var deltaTxt = (res.delta >= 0 ? "+" : "") + res.delta;
    wrap.appendChild(el("div", "karma-delta", "Phước Đức thay đổi: <b class=\"" + deltaClass + "\">" + deltaTxt + "</b>"));

    var actions = el("div", "actions");

    var curIndex = CHAPTERS.findIndex(function(c){ return c.id === ch.id; });
    var nextCh = CHAPTERS[curIndex + 1];
    var allDone = Object.keys(state.completed).length === CHAPTERS.length;

    if (nextCh) {
      var nextBtn = el("button", "btn block", "Chương Tiếp Theo →");
      nextBtn.addEventListener("click", function(){
        state.activeChapter = nextCh;
        state.screen = "story";
        render();
      });
      actions.appendChild(nextBtn);
    } else if (allDone) {
      var endBtn0 = el("button", "btn block", "Xem Kết Cục Cuộc Đời");
      endBtn0.addEventListener("click", function(){
        state.screen = "ending";
        render();
      });
      actions.appendChild(endBtn0);
    }

    var backBtn = el("button", "btn secondary block", "Trở Về Ngã Rẽ");
    backBtn.addEventListener("click", function(){
      state.screen = "map";
      render();
    });
    actions.appendChild(backBtn);

    wrap.appendChild(actions);
    main.appendChild(wrap);
  }

  function getEndingProfile(avg) {
    if (avg >= 5.3) {
      return {
        glyph: "福壽",
        art: ART_END_GOOD,
        title: "Phước Dày Thọ Trường",
        text: "Trải qua sáu ngã rẽ, bạn phần lớn chọn giữ mình ngay thẳng, thương người, trọng nghĩa. Như lời sách xưa: \"Tích thiện chi gia, tất hữu dư khánh\" — nhà tích điều thiện ắt có phúc thừa. Đường đời của bạn tuy có gập ghềnh nhưng gốc rễ vững chắc, phúc phần lan đến con cháu."
      };
    } else if (avg >= 2) {
      return {
        glyph: "安康",
        art: ART_END_MID,
        title: "An Khang Bình Ổn",
        text: "Bạn giữ được cái gốc thiện lương trong phần lớn quyết định, dù đôi lúc còn do dự hoặc tính toán thiệt hơn. Cuộc đời như vậy không rực rỡ nhưng bình yên, ít tai ương lớn, đủ để tự hào khi nhìn lại."
      };
    } else if (avg >= -0.8) {
      return {
        glyph: "浮沉",
        art: ART_END_MIXED,
        title: "Đường Đời Trồi Sụt",
        text: "Có lúc bạn chọn điều thiện, có lúc lại buông theo cái lợi trước mắt. Phước và họa vì thế cứ đan xen, được mất khó lường. Sách xưa dạy: \"Nhất niệm chi thiện, tường vân khánh tuyết; nhất niệm chi ác, lệ cốc âm phong\" — một niệm thiện đủ mây lành phủ khắp, một niệm ác đủ gió dữ nổi lên."
      };
    } else {
      return {
        glyph: "禍殃",
        art: ART_END_BAD,
        title: "Họa Đến Từ Tâm Buông Thả",
        text: "Phần lớn ngã rẽ, bạn chọn con đường dễ dãi cho bản thân mà quên nghĩ đến người khác. Như trong các câu chuyện khuyến thiện, cái lợi nhất thời thường kéo theo hệ lụy lâu dài. Đây không phải kết cục cuối cùng — mỗi ngày sống là một ngã rẽ mới để chọn lại."
      };
    }
  }

  function renderEnding() {
    clearMain();
    globalNote.classList.remove("hidden");
    var total = state.phuc;
    var avg = total / CHAPTERS.length;
    var profile = getEndingProfile(avg);

    var wrap = el("div", "ending");
    wrap.appendChild(el("div", "art-frame hero", profile.art));
    wrap.appendChild(el("div", "glyph", profile.glyph));
    wrap.appendChild(el("h2", "", profile.title));
    wrap.appendChild(el("div", "score", "Tổng Phước Đức: " + total));
    wrap.appendChild(el("p", "", profile.text));

    var journal = el("div", "journal");
    journal.appendChild(el("h4", "", "Nhật Ký Sáu Ngã Rẽ"));
    CHAPTERS.forEach(function(ch){
      var rec = state.completed[ch.id];
      var row = el("div", "journal-row");
      row.appendChild(el("span", "", ch.title));
      if (rec) {
        var d = (rec.delta >= 0 ? "+" : "") + rec.delta;
        row.appendChild(el("span", rec.delta < 0 ? "neg" : "", d));
      } else {
        row.appendChild(el("span", "", "—"));
      }
      journal.appendChild(row);
    });
    wrap.appendChild(journal);

    var actions = el("div", "actions");
    var mapBtn = el("button", "btn secondary block", "Xem Lại Các Ngã Rẽ");
    mapBtn.addEventListener("click", function(){
      state.screen = "map";
      render();
    });
    var resetBtn = el("button", "btn block", "Bắt Đầu Hành Trình Mới");
    resetBtn.addEventListener("click", function(){
      resetProgress();
      state.screen = "intro";
      render();
    });
    actions.appendChild(mapBtn);
    actions.appendChild(resetBtn);
    wrap.appendChild(actions);

    main.appendChild(wrap);
  }

  function render() {
    updatePhucDisplay();
    if (state.screen === "intro") renderIntro();
    else if (state.screen === "map") renderMap();
    else if (state.screen === "story") renderStory();
    else if (state.screen === "result") renderResult();
    else if (state.screen === "ending") renderEnding();
    window.scrollTo(0, 0);
  }

  loadProgress();
  render();
})();
</script>
</body>
